                    "on-secondary-container": "#27378a",
                    "primary-fixed": "#d4e3ff",
                    "on-tertiary-fixed-variant": "#00504a",
                    "tertiary": "#006860",
                    "on-background": "#191c1e",
                    "surface-tint": "#0060ac",
                    "tertiary-container": "#00837a",
                    "outline": "#717783",

            "borderRadius": {

            "spacing": {

                    "base": "8px",

                    "lg": "24px",

            },
            "fontFamily": {

                    "title-lg": ["Inter"],

            "fontSize": {

                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],

                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1px", "fontWeight": "500"}],

          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        .active-tab {
            position: relative;
        }
        .active-tab::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background-color: #005da7;
            border-radius: 99px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Top Branding Section -->
<header class="w-full max-w-md px-container-padding pt-xl pb-lg flex flex-col items-center">
<div class="w-32 h-32 rounded-3xl bg-primary-container flex items-center justify-center mb-lg overflow-hidden shadow-sm">
<img class="w-full h-full object-cover" data-alt="A clean and stylized 3D rendered academic graduation cap and an open book floating in a soft blue void. The lighting is bright and airy, using the primary soft blue and white palette of the design system. The aesthetic is modern corporate with a focus on education and scholarly achievement." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFu3KE6J3MNrbpxbpK9S6nOwKgGXAQGZYDkxrS3CGr_Q2pycw88hiXFF3MUx_25EeJ919HoDra2PCOehVGPT1dxO9McUHr6sN1SDET16nMLGctMCkacV6-5z1kUhw5k-Axpek3D2JYZtv-cV239xnq1mbhzTyjGAnqX2FytAcZ_VXUYpm1Ic939VBkVjYo02yJt26sNONRrP1I93IB2_yrF7wJqV_u4Wqvaev-H4rxAsInl0mGNbJNXTuj949iIzE5A0swZbFec-w"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">CourseMate</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-xs">欢迎来到 CourseMate</p>
</header>
<!-- Main Auth Canvas -->
<main class="w-full max-w-md px-container-padding flex-grow flex flex-col">
<!-- Auth Tabs -->
<div class="flex justify-center space-x-xl mb-xl border-b border-outline-variant/30 pb-base">
<button class="font-title-lg text-title-lg text-primary active-tab transition-colors" id="tab-login" onclick="switchAuth('login')">登录</button>
<button class="font-title-lg text-title-lg text-on-surface-variant hover:text-primary transition-colors" id="tab-register" onclick="switchAuth('register')">注册</button>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-lg" id="auth-form" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="relative group">
<label class="absolute left-md -top-3 px-xs bg-background text-label-lg font-label-lg text-primary z-10" for="email">学校邮箱 / 用户名</label>
<div class="flex items-center border-2 border-outline focus-within:border-primary rounded-lg px-md h-14 transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">alternate_email</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg placeholder:text-outline-variant" id="email" placeholder="example@university.edu" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="relative group">
<label class="absolute left-md -top-3 px-xs bg-background text-label-lg font-label-lg text-on-surface-variant group-focus-within:text-primary z-10 transition-colors" for="password">密码</label>
<div class="flex items-center border-2 border-outline-variant focus-within:border-primary rounded-lg px-md h-14 transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button class="material-symbols-outlined text-on-surface-variant hover:text-primary" type="button">visibility</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end" id="login-extras">
<a class="font-label-lg text-label-lg text-primary hover:underline" href="#">忘记密码</a>
</div>
<!-- Register Specific Fields (Hidden by default) -->
<div class="hidden flex flex-col gap-lg" id="register-fields">
<div class="relative group">
<label class="absolute left-md -top-3 px-xs bg-background text-label-lg font-label-lg text-on-surface-variant group-focus-within:text-primary z-10" for="confirm-password">确认密码</label>
<div class="flex items-center border-2 border-outline-variant focus-within:border-primary rounded-lg px-md h-14">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">verified_user</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg placeholder:text-outline-variant" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-lg font-title-lg text-title-lg shadow-sm active:scale-95 transition-all duration-150 mt-base" id="submit-btn">
                登录
            </button>
</form>
<!-- Social / Third-Party Login -->
<div class="mt-xl">
<div class="flex items-center gap-md mb-lg">
<div class="flex-grow h-px bg-outline-variant"></div>
<span class="font-label-lg text-label-lg text-on-surface-variant whitespace-nowrap">其他方式登录</span>
<div class="flex-grow h-px bg-outline-variant"></div>
</div>
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm h-12 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">
<img class="w-5 h-5 rounded-sm" data-alt="A small, minimalist vector icon represention of a chat bubble for WeChat, stylized in high-contrast blue and white to match the university app theme. The background is a clean white studio setting with soft shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDhi1YMpjY0kDWiaJlQgPXSLYZ3E3DlJZeaXNXH7Wcu50AzD2-ff0CboZMouQIAIioRMWsf6neoERVXYHx6ZVkYiE8pjTNTce-iHsMgWFDWB8dZdg9dKFVOvDWkqFK3WBPM4u81xvhRCBYYc1kPeNRuiSGs40kxswzCczhmsmLemEOrFa-0SHbKs3zl_G8EGImDsLwVRi13KbHF3nUZZCZp7gPPg0YrwgFX3pws9gO5PmOO9UpGNqfP4S4FMXZrG5tWm_7jiWNs3P0"/>
<span class="font-label-lg text-label-lg text-on-surface">微信</span>
</button>
<button class="flex items-center justify-center gap-sm h-12 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="font-label-lg text-label-lg text-on-surface">学号登录</span>
</button>
</div>
</div>
</main>
<!-- Footer Terms -->
<footer class="w-full max-w-md px-container-padding py-xl text-center">
<p class="font-label-lg text-label-lg text-on-surface-variant">
            登录即代表您同意 <a class="text-primary hover:underline" href="#">用户协议</a> 和 <a class="text-primary hover:underline" href="#">隐私政策</a>
</p>
</footer>
<script>
        function switchAuth(type) {
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const loginExtras = document.getElementById('login-extras');
            const registerFields = document.getElementById('register-fields');
            const submitBtn = document.getElementById('submit-btn');

            if (type === 'login') {
                loginTab.classList.add('active-tab', 'text-primary');
                loginTab.classList.remove('text-on-surface-variant');
                registerTab.classList.remove('active-tab', 'text-primary');
                registerTab.classList.add('text-on-surface-variant');
                
                loginExtras.classList.remove('hidden');
                registerFields.classList.add('hidden');
                submitBtn.innerText = '登录';
            } else {
                registerTab.classList.add('active-tab', 'text-primary');
                registerTab.classList.remove('text-on-surface-variant');
                loginTab.classList.remove('active-tab', 'text-primary');
                loginTab.classList.add('text-on-surface-variant');
                
                loginExtras.classList.add('hidden');
                registerFields.classList.remove('hidden');
                submitBtn.innerText = '注册账户';
            }
        }

        // Simple visibility toggle logic
        document.querySelector('button[type="button"]').addEventListener('click', function() {
            const input = this.previousElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                this.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                this.innerText = 'visibility';
            }
        });
    </script>
</body></html>
