<script>
        // Simple scroll behavior for the header
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-sm');
                header.classList.remove('bg-surface/80');
                header.classList.add('bg-surface');
            } else {
                header.classList.remove('shadow-sm');
                header.classList.add('bg-surface/80');
                header.classList.remove('bg-surface');
            }
        });

        // Interactive chip selection
        const chips = document.querySelectorAll('.no-scrollbar button');
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
                    c.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                });
                chip.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
                chip.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
            });
        });
    </script>
